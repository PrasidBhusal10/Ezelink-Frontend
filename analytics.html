<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analytics — EzeLink</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .page-wrap { padding:36px 0 80px; }

    .back-link {
      display:inline-flex; align-items:center; gap:6px;
      color:var(--text-3); text-decoration:none; font-size:0.88rem;
      font-weight:600; margin-bottom:24px; transition:color 0.2s;
    }
    .back-link:hover { color:var(--purple); }

    /* Slug header */
    .slug-header {
      background:var(--bg-2); border:1.5px solid var(--border);
      border-radius:var(--radius); padding:28px 32px;
      margin-bottom:24px; box-shadow:var(--shadow-sm);
      display:flex; align-items:center; justify-content:space-between;
      gap:20px; flex-wrap:wrap; position:relative; overflow:hidden;
    }
    .slug-header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad-1); }
    .slug-name {
      font-family:var(--font-head); font-size:2rem; font-weight:900;
      letter-spacing:-0.02em;
      background:var(--grad-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .slug-dest { font-size:0.88rem; color:var(--text-3); font-weight:500; margin-top:5px; max-width:500px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .slug-actions { display:flex; gap:10px; flex-shrink:0; }

    /* Overview cards */
    .overview { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
    .ov-card {
      background:var(--bg-2); border:1.5px solid var(--border);
      border-radius:var(--radius); padding:24px;
      box-shadow:var(--shadow-sm); transition:all 0.25s; text-align:center;
    }
    .ov-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
    .ov-icon { font-size:1.6rem; margin-bottom:10px; display:block; }
    .ov-num { font-family:var(--font-head); font-size:2.4rem; font-weight:900; line-height:1; letter-spacing:-0.02em; }
    .ov-lbl { font-size:0.8rem; font-weight:700; color:var(--text-3); margin-top:6px; text-transform:uppercase; letter-spacing:0.05em; }

    /* Charts */
    .charts { display:grid; grid-template-columns:3fr 2fr; gap:20px; margin-bottom:24px; }
    .chart-card {
      background:var(--bg-2); border:1.5px solid var(--border);
      border-radius:var(--radius); padding:28px; box-shadow:var(--shadow-sm);
    }
    .chart-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .chart-title { font-family:var(--font-head); font-size:1.05rem; font-weight:800; }
    .chart-sub { font-size:0.8rem; color:var(--text-3); font-weight:600; }
    .chart-wrap { position:relative; height:220px; }

    /* Country list */
    .country-list { display:flex; flex-direction:column; gap:12px; }
    .country-row { display:flex; align-items:center; gap:12px; }
    .country-flag { font-size:1.2rem; width:28px; text-align:center; flex-shrink:0; }
    .country-name { font-size:0.88rem; font-weight:700; color:var(--text); flex:1; }
    .country-bar-bg { flex:2; height:8px; background:var(--bg-3); border-radius:100px; overflow:hidden; }
    .country-bar { height:100%; border-radius:100px; background:var(--grad-1); transition:width 1.2s cubic-bezier(0.4,0,0.2,1); }
    .country-count { font-size:0.82rem; font-weight:700; color:var(--text-2); width:36px; text-align:right; flex-shrink:0; }

    /* No data */
    .no-data { text-align:center; padding:32px; color:var(--text-3); }
    .no-data-icon { font-size:2rem; margin-bottom:10px; display:block; opacity:0.4; }
    .no-data p { font-size:0.85rem; font-weight:600; line-height:1.6; }

    @media(max-width:768px) { .charts { grid-template-columns:1fr; } .overview { grid-template-columns:repeat(3,1fr); } }
    @media(max-width:500px) { .ov-num { font-size:1.8rem; } }
  </style>
</head>
<body>
  <div class="bg-dots"></div>
  <div id="toast-container"></div>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">⚡ EzeLink</a>
      <div class="nav-links">
        <a href="index.html"     class="nav-link hide-mobile">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <span class="nav-link hide-mobile" id="nav-email" style="color:var(--text-3);font-size:0.85rem"></span>
        <button onclick="logout()" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-wrap">
      <a href="dashboard.html" class="back-link">← Back to dashboard</a>

      <!-- Slug header -->
      <div class="slug-header">
        <div>
          <div class="slug-name" id="slug-name">Loading…</div>
          <div class="slug-dest" id="slug-dest"></div>
        </div>
        <div class="slug-actions">
          <button class="btn btn-secondary btn-sm" id="copy-btn" onclick="doCopy()">📋 Copy link</button>
          <a class="btn btn-primary btn-sm" id="open-btn" href="#" target="_blank">Open link ↗</a>
        </div>
      </div>

      <!-- Overview -->
      <div class="overview">
        <div class="ov-card">
          <span class="ov-icon">📊</span>
          <div class="ov-num grad" id="ov-total">—</div>
          <div class="ov-lbl">Total clicks</div>
        </div>
        <div class="ov-card">
          <span class="ov-icon">📅</span>
          <div class="ov-num grad2" id="ov-today">—</div>
          <div class="ov-lbl">Today</div>
        </div>
        <div class="ov-card">
          <span class="ov-icon">🌍</span>
          <div class="ov-num grad3" id="ov-countries">—</div>
          <div class="ov-lbl">Countries</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts">
        <!-- Timeline -->
        <div class="chart-card">
          <div class="chart-head">
            <div class="chart-title">Clicks over time</div>
            <div class="chart-sub">Last 30 days</div>
          </div>
          <div class="chart-wrap">
            <canvas id="timeline-chart"></canvas>
          </div>
        </div>

        <!-- Countries -->
        <div class="chart-card">
          <div class="chart-head">
            <div class="chart-title">Top countries</div>
            <div class="chart-sub" id="country-sub">By clicks</div>
          </div>
          <div id="country-list">
            <div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!requireAuth()) throw new Error();
    updateNav();

    const BASE   = 'http://localhost:8000';
    const params = new URLSearchParams(window.location.search);
    const slug   = params.get('slug');
    if (!slug) window.location.href = 'dashboard.html';
    document.title = `/${slug} Analytics — EzeLink`;

    let chartInstance = null;

    async function load() {
      try {
        const data = await api.get(`/analytics/${slug}`);

        // Header
        document.getElementById('slug-name').textContent = `ezelink.io/${slug}`;
        document.getElementById('slug-dest').textContent = truncate(data.original_url, 65);
        document.getElementById('open-btn').href = `${BASE}/${slug}`;

        // Overview
        document.getElementById('ov-total').textContent     = data.total_clicks.toLocaleString();
        document.getElementById('ov-countries').textContent = data.by_country.length;

        const today    = new Date().toISOString().slice(0,10);
        const todayRow = data.by_day.find(d => d.day === today);
        document.getElementById('ov-today').textContent = todayRow ? todayRow.clicks : 0;

        // Timeline
        renderTimeline(data.by_day);

        // Countries
        renderCountries(data.by_country, data.total_clicks);

      } catch(e) {
        toast(e.message, 'error');
        document.getElementById('slug-name').textContent = `/${slug}`;
      }
    }

    function renderTimeline(byDay) {
      // Fill 30 days
      const filled = [];
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0,10);
        const row = byDay.find(r => r.day === key);
        filled.push({ day: key, clicks: row ? row.clicks : 0 });
      }

      if (chartInstance) chartInstance.destroy();
      const ctx = document.getElementById('timeline-chart').getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 220);
      grad.addColorStop(0, 'rgba(247,37,133,0.18)');
      grad.addColorStop(1, 'rgba(247,37,133,0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: filled.map(r => {
            const d = new Date(r.day + 'T00:00:00');
            return d.toLocaleDateString('en', { month:'short', day:'numeric' });
          }),
          datasets: [{
            data: filled.map(r => r.clicks),
            borderColor: '#f72585',
            backgroundColor: grad,
            borderWidth: 2.5,
            fill: true,
            tension: 0.4,
            pointRadius: 3,
            pointBackgroundColor: '#f72585',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display:false } },
          scales: {
            x: {
              grid: { color:'#f0eeff', drawBorder:false },
              ticks: { color:'#8b85a8', maxTicksLimit:7, font:{ family:'Plus Jakarta Sans', size:11, weight:'600' } }
            },
            y: {
              grid: { color:'#f0eeff', drawBorder:false },
              ticks: { color:'#8b85a8', stepSize:1, font:{ family:'Plus Jakarta Sans', size:11, weight:'600' } },
              beginAtZero: true,
            }
          }
        }
      });
    }

    function renderCountries(byCountry, total) {
      const el = document.getElementById('country-list');

      if (!byCountry.length) {
        el.innerHTML = `
          <div class="no-data">
            <span class="no-data-icon">🌍</span>
            <p>No country data yet.<br/>Click data appears here once real visitors click your link.</p>
          </div>`;
        return;
      }

      const max = byCountry[0].clicks;
      document.getElementById('country-sub').textContent = `${byCountry.length} countries`;

      el.innerHTML = `<div class="country-list">${
        byCountry.slice(0,8).map(r => `
          <div class="country-row">
            <span class="country-flag">🌐</span>
            <span class="country-name">${r.country || 'Unknown'}</span>
            <div class="country-bar-bg">
              <div class="country-bar" style="width:${(r.clicks/max*100).toFixed(1)}%"></div>
            </div>
            <span class="country-count">${r.clicks}</span>
          </div>
        `).join('')
      }</div>`;
    }

    function doCopy() {
      const btn = document.getElementById('copy-btn');
      copyText(`${BASE}/${slug}`, btn);
      toast('Link copied!');
    }

    load();
  </script>
</body>
</html>
