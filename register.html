<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — EzeLink</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; min-height:100vh; }
    .auth-side { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; position:relative; z-index:1; }
    .auth-panel { width:100%; max-width:420px; animation:fadeUp 0.5s ease both; }
    .auth-back { display:inline-flex; align-items:center; gap:6px; color:var(--text-3); text-decoration:none; font-size:0.88rem; font-weight:600; margin-bottom:36px; transition:color 0.2s; }
    .auth-back:hover { color:var(--purple); }
    .auth-head { margin-bottom:32px; }
    .auth-head h1 { font-family:var(--font-head); font-size:2.2rem; font-weight:900; letter-spacing:-0.03em; margin-bottom:8px; }
    .auth-head p { color:var(--text-2); font-size:0.95rem; font-weight:500; }
    .auth-form { display:flex; flex-direction:column; gap:18px; }
    .auth-switch { text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-2); font-weight:500; }
    .auth-switch a { color:var(--purple); font-weight:700; text-decoration:none; }

    .perks-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:28px; }
    .perk-chip {
      background:var(--bg-3); border:1.5px solid var(--border);
      border-radius:var(--radius-sm); padding:10px 14px;
      font-size:0.82rem; font-weight:700; color:var(--text-2);
      display:flex; align-items:center; gap:8px;
    }

    .deco-side {
      width:400px; flex-shrink:0;
      background:linear-gradient(145deg,#3a86ff,#7209b7,#f72585);
      display:flex; align-items:center; justify-content:center;
      padding:60px 48px; position:relative; overflow:hidden;
    }
    .deco-side::before {
      content:''; position:absolute; inset:0;
      background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Crect x='0' y='0' width='20' height='20'/%3E%3Crect x='20' y='20' width='20' height='20'/%3E%3C/g%3E%3C/svg%3E");
    }
    .deco-content { position:relative; color:white; text-align:center; }
    .deco-logo { font-family:var(--font-head); font-size:2.5rem; font-weight:900; margin-bottom:20px; }
    .deco-tagline { font-size:1.3rem; font-weight:700; line-height:1.5; margin-bottom:32px; opacity:0.95; }
    .deco-stat { display:flex; gap:28px; justify-content:center; }
    .dstat { text-align:center; }
    .dstat-num { font-family:var(--font-head); font-size:2rem; font-weight:900; }
    .dstat-lbl { font-size:0.78rem; font-weight:600; opacity:0.8; margin-top:2px; text-transform:uppercase; letter-spacing:0.05em; }

    @media(max-width:768px) { .deco-side { display:none; } }
  </style>
</head>
<body>
  <div class="bg-dots"></div>
  <div class="bg-blob bg-blob-1" style="opacity:0.06"></div>
  <div id="toast-container"></div>

  <div class="auth-side">
    <div class="auth-panel">
      <a href="index.html" class="auth-back">← Back to EzeLink</a>

      <div class="auth-head">
        <h1>Create account <span class="grad">🚀</span></h1>
        <p>Free forever. Start shortening links in seconds.</p>
      </div>

      <div class="perks-row">
        <div class="perk-chip">⚡ Instant redirects</div>
        <div class="perk-chip">📊 Click analytics</div>
        <div class="perk-chip">🎯 Custom slugs</div>
        <div class="perk-chip">🌍 Country tracking</div>
      </div>

      <form class="auth-form" onsubmit="doRegister(event)">
        <div class="field">
          <label class="field-label">Email address</label>
          <input id="email" class="input" type="email"
            placeholder="you@example.com" autocomplete="email" required/>
        </div>
        <div class="field">
          <label class="field-label">Password <span style="color:var(--text-3);font-weight:400">(min. 8 characters)</span></label>
          <input id="password" class="input" type="password"
            placeholder="Create a strong password" autocomplete="new-password" required minlength="8"/>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="reg-btn">
          Create my account →
        </button>
      </form>

      <div class="auth-switch" style="margin-top:28px">
        Already have an account? <a href="login.html">Login here →</a>
      </div>
    </div>
  </div>

  <div class="deco-side">
    <div class="deco-content">
      <div class="deco-logo">⚡ EzeLink</div>
      <div class="deco-tagline">Join thousands making<br/>links the eze way.</div>
      <div class="deco-stat">
        <div class="dstat">
          <div class="dstat-num">&lt;1ms</div>
          <div class="dstat-lbl">Redirects</div>
        </div>
        <div class="dstat">
          <div class="dstat-num">∞</div>
          <div class="dstat-lbl">Links</div>
        </div>
        <div class="dstat">
          <div class="dstat-num">100%</div>
          <div class="dstat-lbl">Uptime</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (auth.isLoggedIn()) window.location.href = 'dashboard.html';

    async function doRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      btn.innerHTML = '<span class="spinner"></span> Creating account…';
      btn.disabled = true;

      try {
        const data = await api.post('/auth/register', {
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        auth.save(data.access_token, data.email);
        toast('Account created! Welcome to EzeLink 🎉');
        setTimeout(() => window.location.href = 'dashboard.html', 700);
      } catch(e) {
        toast(e.message, 'error');
        btn.textContent = 'Create my account →';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
